# The live deploy. Every push to main type-checks and builds the deck builder,
# runs the vitest suite against the real card payload, and only then publishes
# web/dist to GitHub Pages at https://galpartuk.github.io/digiport/.
#
# Needs no secrets: Pages is published straight from the build artifact, so the
# repository never carries a deploy token. It does need Settings -> Pages ->
# "Build and deployment" -> Source set to "GitHub Actions" (done once).
#
# The build works on a project subpath because web/vite.config.ts sets
# base: './' and src/cards.ts fetches through import.meta.env.BASE_URL, so
# every asset and both data files resolve relative to the served document.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # a deploy button, for re-shipping without a commit

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a half-uploaded artifact
# would leave the site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # Tests run before the build so a red suite costs nothing to find out.
      - name: Test
        working-directory: web
        run: npm test

      # tsc runs as part of the build, so this covers type errors too.
      - name: Build
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
